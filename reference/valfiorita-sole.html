<title>Valfiorita al sole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: vista in prima persona a tutto schermo con l'HUD di Runess: targa in alto a sinistra, riflessi in alto a destra, joystick in basso a sinistra, ritorno al mercato in basso a destra. Un solo tema scuro: è l'interfaccia del gioco. */
:root {
  --ground: #110e0b;
  --panel: rgba(26, 21, 16, 0.88);
  --panel-hi: #241d16;
  --picked: #2e2418;
  --bronze: #5c452b;
  --bronze-lit: #d6a352;
  --key-edge: #9a7550;
  --text: #dccdb4;
  --dim: #a3917a;
  --gold: #ffd999;
  --outline: #080503;
  --f-display: "Jacquard 24", "Pixelify Sans", ui-monospace, monospace;
  --f-ui: "Pixelify Sans", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #6f7a72; color: var(--text); font-family: var(--f-ui); }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }
.panel { background: var(--panel); border: 3px solid var(--bronze); box-shadow: 0 0 0 2px var(--outline); }
.plate { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); padding: 8px 14px 10px; pointer-events: none; max-width: min(380px, calc(100% - 48px)); display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--bronze-lit); }
.plate h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 6vw, 42px); line-height: .95; margin: 0; color: var(--gold); text-wrap: balance; text-shadow: 2px 2px 0 var(--outline); }
.keys { margin: 2px 0 0; font-size: 13px; color: var(--dim); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
kbd { font-family: var(--f-ui); font-size: 12px; color: var(--text); background: var(--panel-hi); border: 2px solid var(--key-edge); box-shadow: 0 0 0 1px var(--outline); padding: 0 5px; line-height: 17px; }
.touch-only { display: none; }
@media (pointer: coarse) { .mouse-only { display: none; } .touch-only { display: inline; } }
.filters { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
button.act { font-family: var(--f-ui); font-size: 15px; padding: 5px 12px; cursor: pointer; color: var(--text); background: var(--panel); border: 2px solid var(--bronze); box-shadow: 0 0 0 2px var(--outline); }
button.act:hover { border-color: var(--bronze-lit); color: var(--gold); }
button.act:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
button.act[aria-pressed="true"] { border-color: var(--bronze-lit); color: var(--gold); background: var(--picked); }
button.act[aria-pressed]::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; vertical-align: 1px; background: var(--bronze); box-shadow: 0 0 0 1px var(--outline); }
button.act[aria-pressed="true"]::before { background: var(--gold); }
.home { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); }
.stick { position: fixed; left: max(20px, calc(env(safe-area-inset-left, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: 112px; height: 112px; touch-action: none; background: rgba(26, 21, 16, 0.55); border: 3px solid var(--bronze); box-shadow: 0 0 0 2px var(--outline);
  clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); }
.knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; background: var(--gold); border: 3px solid var(--bronze-lit); box-shadow: inset -4px -4px 0 #c99a4a; pointer-events: none; }
.err { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 16px; color: var(--gold); max-width: calc(100% - 48px); text-align: center; }
.hud-toggle { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 5; }
.hud { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); width: min(400px, calc(100% - 32px)); max-height: calc(100% - 110px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; z-index: 4; }
.hud[hidden] { display: none; }
.hud .plate, .hud .filters, .hud .home { position: static; max-width: none; }
.hud .filters, .hud .home { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
</style>

<canvas id="scene" aria-label="Vista in prima persona dalla piazza del mercato di un borgo fantasy in una giornata di sole, con gli abitanti che passeggiano"></canvas>
<div class="hud" id="hud" hidden>
<div class="plate panel">
  <span class="eyebrow">Valfiorita · giornata di sole</span>
  <h1>Piazza del Mercato</h1>
  <p class="keys mouse-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> cammina · <kbd>Shift</kbd> corri · trascina per guardare</p>
  <p class="keys touch-only">Trascina per guardare · joystick per camminare</p>
  <p class="keys">Avvicinati agli abitanti: ti salutano.</p>
</div>
<div class="filters"><button class="act" id="scan" type="button" aria-pressed="true">Linee</button><button class="act" id="refl" type="button" aria-pressed="true">Riflessi</button></div>
<div class="home"><button class="act" id="home" type="button">Torna al mercato</button></div>
</div>
<div class="stick" id="stick" role="application" aria-label="Joystick per camminare"><div class="knob" id="knob"></div></div>
<button class="act hud-toggle" id="hudBtn" type="button" aria-expanded="false" aria-controls="hud">☰ Comandi</button>
<div class="err panel" id="err" hidden>Il tuo dispositivo non supporta WebGL, quindi la scena non può essere mostrata.</div>

<script>{const h=document.getElementById('hud'),b=document.getElementById('hudBtn');const set=o=>{h.hidden=!o;b.setAttribute('aria-expanded',String(o));b.textContent=o?'✕ Chiudi':'☰ Comandi';document.getElementById('stick').style.visibility=o?'hidden':'';};b.addEventListener('click',()=>set(h.hidden));addEventListener('keydown',e=>{if(e.key==='Escape')set(false);});}</script>

<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('err').hidden=false;return;}
const V=THREE.Vector3, PI=Math.PI, D2R=PI/180;

/* ================= renderer ================= */
const canvas=document.getElementById('scene');

/* ================= luci ================= */

/* ================= rng ================= */
let seed=20261112;

/* ================= texture disegnate ================= */

function ctex(S,draw){const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');draw(x,S);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}

function pix(S,fn,rot){const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),im=x.createImageData(S,S);
  for(let y=0;y<S;y++)for(let X=0;X<S;X++){const[u,v]=rot?[y,S-1-X]:[X,y];const p=fn(u,v,S);if(p[0]===p[1]&&p[1]===p[2]){const t=(hn(X>>2,y>>2,91)-0.5)*0.24+(hn(X,y,92)-0.5)*0.08,gq=(hn(X>>3,y>>3,93)-0.5)*0.12;p[0]*=1+t;p[1]*=1+gq;p[2]*=1-t;}const k=(y*S+X)*4;im.data[k]=p[0];im.data[k+1]=p[1];im.data[k+2]=p[2];im.data[k+3]=255;}
  x.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return t;}

const G=v=>{v=Math.max(0,Math.min(255,v|0));return[v,v,v];};
const tilePix=(u,v,S)=>{const row=v>>3,off=(row&1)*4,col=((u+off)>>3),lu=(u+off)&7,lv=v&7;
  const b=135+hn(col,row,1)*100,q=hn(u,v,2);if(lv===7)return G(b*0.2);if(lv===6)return G(b*0.48);if(lu===0&&lv>1)return G(b*0.5);
  if(lv===0)return G(Math.min(255,b*1.3));if(q<.035&&lv>2)return[78,110,66];const L=b*(0.9+q*.16)-(lv-1)*8+(lu<2?12:0),th=hn(col,row,95)-0.5,tg=hn(col,row,96)-0.5;return[L*(1+th*0.3),L*(1+tg*0.18),L*(1-th*0.3)];};
const TEX={
  tilesV:pix(64,tilePix,false),tilesU:pix(64,tilePix,true),
  stone:pix(64,(u,v)=>{const row=v>>4,off=(row&1)*12,col=Math.floor((u+off)/24),lu=(u+off)%24,lv=v&15;if(lv===15||lu===0)return G(85);const b=185+hn(col,row,3)*55,q=hn(u,v,4),m=hn(u>>2,v>>2,30);if(lv>11&&m<.3)return[130+q*30,150+q*25,105];return G(b*(0.88+q*.16)+(lv<2?14:0)-(lu>21?14:0));}),
  cobble:pix(128,(u,v)=>{const row=Math.floor(v/12),off=(row&1)*9,col=Math.floor((u+off)/18),lu=(u+off)%18,lv=v%12;if(lv===11||lu===17||(lv<1&&lu<1))return G(70);const b=195+hn(col,row,5)*55,q=hn(u,v,6);if((lu===0||lv===10)&&q<.6)return G(b*.7);return G(b*(0.86+q*.18)+(lv<2?16:0));}),
  grass2:pix(128,(u,v)=>{const q=hn(u,v,107),o=(hn(u,0,108)*8)|0,bl=hn(u,(v+o)>>2,109);let b=128+bl*78+q*26;if(bl>0.88&&((v+o)&3)===0)b+=45;if(q<.05)b=72;if(hn(u>>2,v>>2,110)<.035)b=212;if(hn(u>>1,v>>1,111)<.012)b=95;return G(b);}),
  grass:pix(64,(u,v)=>{const q=hn(u,v,7),p=hn(u>>3,v>>3,8);return G(150+p*60+q*45-(q<.12?40:0)+((v+(u>>1))%5===0&&q>.7?20:0));}),
  dirt:pix(64,(u,v)=>{const q=hn(u,v,9),p=hn(u>>3,v>>3,10);return G(170+p*45+q*30-(q<.1?50:0));}),
  wood:pix(128,(u,v)=>{
    const edges=[0,22,38,61,80,104,128];let pl=0;while(u>=edges[pl+1])pl++;const x0=edges[pl],w=edges[pl+1]-x0,lu=u-x0;
    const joint=(hn(pl,9,120)*128)|0,seg=((v-joint+128)%128)<64?0:1,id=pl*2+seg;
    if(lu===0||((v-joint+128)%64)===0)return G(48);
    if(lu===1||lu===w-1)return G(118+hn(u,v,121)*20);
    let b=150+hn(id,0,122)*55;const grey=hn(id,1,123)<0.3;
    const kx=x0+2+hn(id,2,124)*(w-4),ky=hn(id,3,125)*128,dx=u-kx,dy=(v-ky+192)%128-64,kd=Math.hypot(dx*1.6,dy);
    const warp=12/(1+kd*0.12);
    const gr=Math.sin((lu+Math.sin(v*0.07+id)*2.2+warp*Math.sign(dx||1))*1.25+hn(id,4,126)*6);
    b+=gr*14+Math.sin(v*0.9+lu*2.1+id)*3+(hn(u,v,127)-0.5)*18;
    if(kd<2.6&&hn(id,5,128)<0.75)b=kd<1.3?52:90;
    if(hn(id,6,129)<0.35&&Math.abs(lu-(w*0.45|0))<1&&((v+id*13)%128)<40)b-=55;
    if((lu===2||lu===w-3)&&((v-joint+128)%64===4))b=40;
    if(hn(u>>1,v>>2,130)<.05)b-=28;
    b-=Math.max(0,8-Math.abs(((v-joint+128)%64)-32))*0;
    return grey?[b*0.92,b*0.92,b*0.9]:G(b);}),
  plaster:pix(64,(u,v)=>{const q=hn(u,v,15),p=hn(u>>4,v>>4,16);let b=218+p*24+q*12;if(v>50)b-=(v-50)*4*(0.6+q*.6);if(hn(u>>1,v>>3,17)<.03)b-=45;if(hn(u>>2,v,18)<.012)b-=30;return G(b);}),
  bark:pix(32,(u,v)=>{const f=Math.sin(u*0.9+Math.sin(v*0.21)*2.2+hn(u>>2,0,70)*3);let b=150+f*38+hn(u,v,71)*28;if(hn(u>>1,v>>3,72)<.08)b-=60;return G(b);}),
  birch:pix(32,(u,v)=>{let b=232+hn(u,v,73)*18;if(hn(u>>3,v,74)<.1&&(v%3===0))b=70;if(hn(u>>2,v>>2,75)<.07)b=60+hn(u,v,76)*40;if(hn(u>>1,v>>1,77)<.05)b-=50;return G(b);}),
  leaf:pix(32,(u,v)=>{const q=hn(u>>1,v>>1,50),p=hn(u,v,51);if(q<.2)return G(60+p*30);if(q>.88)return G(255);return G(140+q*100+p*25);}),
  ivy:(()=>{const S=32,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),im=x.createImageData(S,S);for(let y=0;y<S;y++)for(let X=0;X<S;X++){const q=hn(X>>1,y>>1,40),k=(y*S+X)*4,on=q<.62;const g=on?70+hn(X,y,41)*90:0;im.data[k]=g*.55;im.data[k+1]=g;im.data[k+2]=g*.45;im.data[k+3]=on?255:0;}x.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;return t;})()
};
/* ================= materiali cel ================= */
const gradTex=new THREE.DataTexture(new Uint8Array([105,185,255]),3,1,THREE.LuminanceFormat);
gradTex.minFilter=gradTex.magFilter=THREE.NearestFilter;gradTex.generateMipmaps=false;gradTex.needsUpdate=true;
const mats={};
// i colori della fiaba, smorzati dalla pioggia; vetri e lanterne diventano luce calda
const LIT={0x8fd3f5:0x56636e,0x9fdcff:0xc89a62,0xffeaa6:0xd8bc8a,0xffe9a0:0xd8bc8a};   // vetri scuri con le tende, lanterne spente
function mute(h){const c=new THREE.Color(h),l=c.r*.3+c.g*.59+c.b*.11;c.r=(c.r*.8+l*.2)*.9;c.g=(c.g*.8+l*.2)*.92;c.b=(c.b*.8+l*.2)*.88;return c;}
const WINTEX=pix(16,(u,v)=>{const cx=Math.abs(u-7.5)/8,cy=Math.abs(v-8.5)/8;let b=255-cx*cx*90-cy*60;if(u<3||u>12)b-=70+hn(u,v>>1,60)*30;if(v<2)b-=40;if(hn(u>>2,v>>2,61)<.12)b-=50;return G(b);});

  s.vertexShader=WEAR_V+s.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\n{vec4 wq=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nwq=instanceMatrix*wq;\n#endif\nvWq=(modelMatrix*wq).xyz;vNw=normalize(mat3(modelMatrix)*objectNormal);}');

   '{vec3 q=floor(vWq*14.0);float vert=1.0-abs(vNw.y);float y=vWq.y;float n=wh(q);'+
   'float g=mix(0.55,1.0,smoothstep(0.0,1.5,y-0.2+n*0.35));'+
   'vec2 tg=normalize(vec2(-vNw.z,vNw.x)+vec2(1e-4));float cl=floor(dot(vWq.xz,tg)*7.0);float s=wh(vec3(cl,3.1,7.7));'+
   'float sk=step(0.72,s)*smoothstep(0.0,1.0,fract(y*0.42+s*5.0))*(0.14+0.22*fract(s*13.7));'+
   'vec3 w=vec3(mix(1.0,g,vert*0.9+0.1));w*=1.0-sk*vert;'+
   'w*=mix(vec3(1.0),vec3(0.8,0.93,0.74),vert*(1.0-smoothstep(0.0,0.8,y-0.15+n*0.3)));'+
   'w*=0.9+0.12*n;w*=mix(1.0,0.84+0.16*wh(floor(vWq*5.0)),max(vNw.y,0.0));'+

function tm(color,o){o=o||{};const k=color+'|'+(o.tex||'')+'|'+(o.emi||0)+'|'+(o.side||0);
  if(!mats[k]){
    if(LIT[color]!=null)mats[k]=new THREE.MeshBasicMaterial({color:LIT[color],map:color===0x8fd3f5?WINTEX:null});
    else{const p={color:mute(color)};if(o.tex)p.map=TEX[o.tex];if(o.tex&&o.tex.indexOf('tiles')===0)p.opacity=0.86;if(o.emi)p.emissive=mute(o.emi).multiplyScalar(.6);if(o.side)p.side=THREE.DoubleSide;mats[k]=wear(new THREE.MeshLambertMaterial(p));}}
  return mats[k];}
const inkMat=new THREE.MeshBasicMaterial({color:0x1d2340,side:THREE.BackSide});
const emiOf=c=>new THREE.Color(c).multiplyScalar(0.45).getHex();

function uvS(g,su,sv){const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv);return g;}

  const f=v=>v<1e-3?1:(v+2*t)/v;const o=new THREE.Mesh(g,inkMat);o.scale.set(f(s.x),f(s.y),f(s.z));
  o.position.set(c.x*(1-o.scale.x),c.y*(1-o.scale.y),c.z*(1-o.scale.z));m.add(o);}
function P(parent,geo,color,x,y,z,o){o=o||{};
  if(o.scale)geo.scale(o.scale[0],o.scale[1],o.scale[2]);

  if(o.line!==0)outline(m,o.line==null?0.05:o.line);

function bake(root){
  root.updateMatrixWorld(true);const buckets=new Map(),ink=[];const other=[];
  root.traverse(o=>{if(!o.isMesh)return;
    if(o.material.isShaderMaterial){other.push(o);return;}
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrixWorld);
    const p=new THREE.BufferGeometry();p.setAttribute('position',g.attributes.position);
    if(o.material===inkMat){ink.push(p);return;}
    p.setAttribute('normal',g.attributes.normal);
    p.setAttribute('uv',g.attributes.uv||new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const k=o.material.uuid+(o.castShadow?'c':'n');if(!buckets.has(k))buckets.set(k,{mat:o.material,cast:o.castShadow,geos:[]});buckets.get(k).geos.push(p);});
  other.forEach(o=>{o.updateMatrixWorld(true);const m=o.matrixWorld.clone();o.parent.remove(o);o.matrix.copy(m);o.matrix.decompose(o.position,o.quaternion,o.scale);scene.add(o);});
  scene.remove(root);
  for(const b of buckets.values()){const g=THREE.BufferGeometryUtils.mergeBufferGeometries(b.geos);if(!g)continue;const m=new THREE.Mesh(g,b.mat);m.castShadow=b.cast;m.receiveShadow=true;m.matrixAutoUpdate=false;scene.add(m);}
  for(let i=0;i<ink.length;i+=1500){const g=THREE.BufferGeometryUtils.mergeBufferGeometries(ink.slice(i,i+1500));if(g){const m=new THREE.Mesh(g,inkMat);m.matrixAutoUpdate=false;scene.add(m);}}
}

class Sim {
  constructor(nx, nz, x0, z0, wd, dd, inside, wrap) {
    Object.assign(this, { nx, nz, x0, z0, wd, dd, wrap, off: 0 });
    this.a = new Float32Array(nx * nz); this.b = new Float32Array(nx * nz); this.m = new Uint8Array(nx * nz);
    for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) this.m[j * nx + i] = inside(x0 + (i + .5) * wd / nx, z0 + (j + .5) * dd / nz) ? 1 : 0;
    this.data = new Uint8Array(nx * nz * 4).fill(128);
    this.tex = new THREE.DataTexture(this.data, nx, nz, THREE.RGBAFormat);
    this.tex.magFilter = this.tex.minFilter = THREE.LinearFilter;
    if (wrap) this.tex.wrapS = THREE.RepeatWrapping;
    this.tex.needsUpdate = true;
  }
  drop(x, z, s, r) {
    let u = (x - this.x0) / this.wd - this.off; if (this.wrap) u -= Math.floor(u);
    const ci = Math.floor(u * this.nx), cj = Math.floor((z - this.z0) / this.dd * this.nz);
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
      const d = Math.hypot(di, dj); if (d > r) continue;
      let i = ci + di; const j = cj + dj; if (this.wrap) i = ((i % this.nx) + this.nx) % this.nx;
      if (i < 0 || j < 0 || i >= this.nx || j >= this.nz) continue;
      const k = j * this.nx + i; if (this.m[k]) this.a[k] -= s * (1 - d / (r + 1));
    }
  }
  step(damp) {
    const { a, b, m, nx, nz, wrap } = this;
    for (let j = 1; j < nz - 1; j++) for (let i = 0; i < nx; i++) {
      const k = j * nx + i;
      if (!m[k]) { b[k] = 0; continue; }

  }

const SURF_FS = `uniform sampler2D hm;uniform vec4 rect;uniform vec2 tx,ctr;uniform float off,amp,cell,t,flow,kind,rad,ringR,fN,fF;
