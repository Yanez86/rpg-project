<title>Valfiorita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap">
<style>
/* Layout: vista in prima persona a tutto schermo; targa in alto, joystick in basso a sinistra, ritorno al mercato in basso a destra */
:root{
  --sky:#8fd3ff;
  --ink:#1d2340;
  --paper:#fff8e6;
  --sun:#ffcf4a;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font-body)}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.plate{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));
  background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);
  padding:10px 16px 10px 14px;pointer-events:none;max-width:calc(100% - 48px);
}
.plate h1{font-family:var(--font-display);font-weight:600;font-size:clamp(1.25rem,4.4vw,1.75rem);line-height:1;margin:0;text-wrap:balance}
.plate p{margin:6px 0 0;font-size:.8rem;font-weight:700;opacity:.75}
.tag{display:inline-block;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:1px 8px;margin-bottom:6px}
.stick{
  position:fixed;left:max(20px,calc(env(safe-area-inset-left,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  width:112px;height:112px;border-radius:50%;
  background:color-mix(in srgb,var(--paper) 55%,transparent);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  touch-action:none;
}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);pointer-events:none}
.controls{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.controls button{
  font-family:var(--font-display);font-weight:500;font-size:.95rem;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:8px 14px;cursor:pointer;
}
.controls button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.controls button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.err{position:fixed;inset:auto 16px 150px 16px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:12px;font-weight:700}
</style>

<canvas id="scene" aria-label="Vista in prima persona dalla piazza del mercato di un borgo fantasy in una giornata di sole"></canvas>
<div class="plate">
  <span class="tag">Valfiorita · mezzogiorno</span>
  <h1>Piazza del Mercato</h1>
  <p>Trascina per guardarti intorno · joystick o WASD per camminare</p>
</div>
<div class="stick" id="stick" role="application" aria-label="Joystick per camminare"><div class="knob" id="knob"></div></div>
<div class="controls"><button id="home" type="button">Torna al mercato</button></div>
<div class="err" id="err" hidden>Il tuo dispositivo non supporta WebGL, quindi la scena non può essere mostrata.</div>

<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('err').hidden=false;return;}
const V=THREE.Vector3, PI=Math.PI, D2R=PI/180;

/* ================= renderer ================= */
const canvas=document.getElementById('scene');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true});}catch(e){document.getElementById('err').hidden=false;return;}
const PR=Math.min(window.devicePixelRatio||1,1.75);
renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;

const scene=new THREE.Scene();
{
  const c=document.createElement('canvas');c.width=4;c.height=256;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#3a9fec');g.addColorStop(.5,'#8fd3ff');g.addColorStop(1,'#dcf4ff');
  x.fillStyle=g;x.fillRect(0,0,4,256);scene.background=new THREE.CanvasTexture(c);
}
scene.fog=new THREE.Fog(0xcdeeff,70,190);
const camera=new THREE.PerspectiveCamera(innerWidth<innerHeight?76:66,innerWidth/innerHeight,0.05,700);
camera.rotation.order='YXZ';

/* ================= luci ================= */
const sunDir=new V(-0.5,0.74,-0.36).normalize();
scene.add(new THREE.HemisphereLight(0xe4f5ff,0x7f9a52,0.55));
scene.add(new THREE.AmbientLight(0xffffff,0.12));
const sun=new THREE.DirectionalLight(0xfff0d2,1.0);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:160});
sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.025;
scene.add(sun);scene.add(sun.target);

/* ================= rng ================= */
let seed=20261112;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const pick=a=>a[Math.floor(rnd()*a.length)];
const R=(a,b)=>a+rnd()*(b-a);

/* ================= texture disegnate ================= */
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function ctex(S,draw){const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');draw(x,S);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}
function tiles(rot){return ctex(128,(x,S)=>{
  if(rot){x.translate(S/2,S/2);x.rotate(PI/2);x.translate(-S/2,-S/2);}
  x.fillStyle='#c2c2c2';x.fillRect(0,0,S,S);
  const rows=4,cols=4,rh=S/rows,cw=S/cols;
  for(let j=0;j<rows;j++)for(let i=-1;i<=cols;i++){
    const cx=(i+(j%2?0.5:0))*cw+cw/2,cy=j*rh;
    x.fillStyle=(i*7+j*3)%4?'#ffffff':'#eeeeee';
    x.beginPath();x.moveTo(cx-cw/2,cy);x.lineTo(cx+cw/2,cy);x.lineTo(cx+cw/2,cy+rh*0.5);x.arc(cx,cy+rh*0.5,cw/2,0,PI);x.closePath();x.fill();
    x.strokeStyle='#8c8c8c';x.lineWidth=3;x.beginPath();x.arc(cx,cy+rh*0.5,cw/2-1,0.15,PI-0.15);x.stroke();
  }
});}
const TEX={
  tilesV:tiles(false),tilesU:tiles(true),
  stone:ctex(128,(x,S)=>{x.fillStyle='#a6a6a6';x.fillRect(0,0,S,S);const rows=6,h=S/rows;
    for(let j=0;j<rows;j++){let px=(j%2)?-18:0;while(px<S){const w=R(26,44);x.fillStyle=pick(['#f6f6f6','#e9e9e9','#fbfbfb','#dfdfdf']);rr(x,px+2,j*h+2,w-4,h-4,5);x.fill();px+=w;}}}),
  cobble:ctex(512,(x,S)=>{x.fillStyle='#9a8670';x.fillRect(0,0,S,S);const rows=11,h=S/rows;
    for(let j=0;j<rows;j++){let px=R(-40,0);while(px<S){const w=R(34,62);x.fillStyle=pick(['#f1e4c8','#e8d6b4','#f6ecd8','#dfcba6','#ecdcbf']);
      for(const o of[0,-S]){rr(x,px+o+3,j*h+3+R(-1,1),w-6,h-6,9);x.fill();}
      px+=w;}}}),
  grass:ctex(256,(x,S)=>{x.fillStyle='#e6e6e6';x.fillRect(0,0,S,S);
    for(let i=0;i<40;i++){x.fillStyle='rgba(210,210,210,.55)';x.beginPath();x.arc(R(0,S),R(0,S),R(10,26),0,7);x.fill();}
    x.lineWidth=2;for(let i=0;i<900;i++){const X=R(0,S),Y=R(0,S);x.strokeStyle=rnd()<.5?'#ffffff':'#cfcfcf';x.beginPath();x.moveTo(X,Y);x.lineTo(X+R(-2,2),Y-R(4,9));x.stroke();}}),
  dirt:ctex(256,(x,S)=>{x.fillStyle='#f1dfb8';x.fillRect(0,0,S,S);
    for(let i=0;i<160;i++){x.fillStyle=pick(['#dcc597','#fff3d6','#cdb383']);x.beginPath();x.ellipse(R(0,S),R(0,S),R(2,6),R(2,4),R(0,3),0,7);x.fill();}}),
  wood:ctex(128,(x,S)=>{x.fillStyle='#ffffff';x.fillRect(0,0,S,S);x.strokeStyle='#dedede';x.lineWidth=1.5;
    for(let i=0;i<40;i++){const X=R(0,S);x.beginPath();x.moveTo(X,0);x.bezierCurveTo(X+R(-4,4),S*.3,X+R(-4,4),S*.7,X+R(-3,3),S);x.stroke();}
    x.fillStyle='#8f8f8f';for(let i=0;i<4;i++)x.fillRect(i*32,0,3,S);})
};

/* ================= materiali cel ================= */
const gradTex=new THREE.DataTexture(new Uint8Array([105,185,255]),3,1,THREE.LuminanceFormat);
gradTex.minFilter=gradTex.magFilter=THREE.NearestFilter;gradTex.generateMipmaps=false;gradTex.needsUpdate=true;
const mats={};
function tm(color,o){o=o||{};const k=color+'|'+(o.tex||'')+'|'+(o.emi||0)+'|'+(o.side||0);
  if(!mats[k]){const p={color,gradientMap:gradTex};if(o.tex)p.map=TEX[o.tex];if(o.emi)p.emissive=new THREE.Color(o.emi);if(o.side)p.side=THREE.DoubleSide;mats[k]=new THREE.MeshToonMaterial(p);}
  return mats[k];}
const inkMat=new THREE.MeshBasicMaterial({color:0x1d2340,side:THREE.BackSide});
const emiOf=c=>new THREE.Color(c).multiplyScalar(0.45).getHex();

function uvS(g,su,sv){const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv);return g;}
function outline(m,t){const g=m.geometry;g.computeBoundingBox();const s=new V(),c=new V();g.boundingBox.getSize(s);g.boundingBox.getCenter(c);
  const f=v=>v<1e-3?1:(v+2*t)/v;const o=new THREE.Mesh(g,inkMat);o.scale.set(f(s.x),f(s.y),f(s.z));
  o.position.set(c.x*(1-o.scale.x),c.y*(1-o.scale.y),c.z*(1-o.scale.z));m.add(o);}
function P(parent,geo,color,x,y,z,o){o=o||{};
  if(o.scale)geo.scale(o.scale[0],o.scale[1],o.scale[2]);
  if(o.uv)uvS(geo,o.uv[0],o.uv[1]);
  const m=new THREE.Mesh(geo,o.mat||tm(color,o));
  m.position.set(x||0,y||0,z||0);if(o.rot)m.rotation.set(o.rot[0],o.rot[1],o.rot[2]);
  m.castShadow=o.cast!==false;m.receiveShadow=true;
  if(o.line!==0)outline(m,o.line==null?0.05:o.line);
  parent.add(m);return m;}
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const uvB=(w,h,d,su,sv)=>uvS(B(w,h,d),su,sv);
const CY=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||16);
const CO=(r,h,s)=>new THREE.ConeGeometry(r,h,s||16);
const SP=(r,d)=>new THREE.IcosahedronGeometry(r,d==null?1:d);
const TO=(r,t,s)=>new THREE.TorusGeometry(r,t,6,s||20);

/* testo dipinto per le insegne (ridisegnato quando il font è pronto) */
const signDraws=[];
function signMat(text,bg,fg,px){
  const c=document.createElement('canvas');c.width=512;c.height=128;const t=new THREE.CanvasTexture(c);t.anisotropy=4;
  const draw=()=>{const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,512,128);x.strokeStyle=fg;x.lineWidth=8;rr(x,10,10,492,108,18);x.stroke();
    x.fillStyle=fg;x.font='600 '+(px||66)+'px Fredoka, "Trebuchet MS", sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,70);t.needsUpdate=true;};
  draw();signDraws.push(draw);
  return new THREE.MeshToonMaterial({map:t,gradientMap:gradTex});
}
if(document.fonts&&document.fonts.load)document.fonts.load('600 66px Fredoka').then(()=>signDraws.forEach(d=>d())).catch(()=>{});

/* ================= pianta del borgo ================= */
const world=new THREE.Group();scene.add(world);
const ISL=46,PLAZA=11.2;
const TOWER=new V(0,0,-25),MILL=new V(29,0,-15);
const RZ=20,RW=4,RX0=-30,RX1=Math.sqrt(ISL*ISL-RZ*RZ)-0.3;
const millDir=new V(MILL.x,0,MILL.z).normalize();
const MP0=millDir.clone().multiplyScalar(PLAZA),MP1=MILL.clone().addScaledVector(millDir,-3.6);
const obs=[];   // ostacoli per camminare [x,z,r]
const ringHooks=[];const chimneys=[];const crowns=[];
function segDist(x,z,a,b){const abx=b.x-a.x,abz=b.z-a.z;const t=Math.max(0,Math.min(1,((x-a.x)*abx+(z-a.z)*abz)/(abx*abx+abz*abz)));return Math.hypot(x-(a.x+abx*t),z-(a.z+abz*t));}
function onPath(x,z,pad){
  if(Math.abs(x)<1.4+pad&&z>PLAZA-1&&z<ISL)return true;
  if(Math.abs(x)<1.4+pad&&z<-PLAZA+1&&z>-21)return true;
  return segDist(x,z,MP0,MP1)<1.3+pad;
}
function inRiver(x,z,pad){return x>RX0-1-pad&&Math.abs(z-RZ)<RW/2+0.5+pad;}
function blocked(x,z,pad){
  const r=Math.hypot(x,z);
  if(r<PLAZA+0.5+pad||r>ISL-3-pad)return true;
  if(inRiver(x,z,pad)||onPath(x,z,pad))return true;
  if(Math.hypot(x-TOWER.x,z-TOWER.z)<6+pad)return true;
  if(Math.hypot(x-MILL.x,z-MILL.z)<4.5+pad)return true;
  for(const o of obs)if(Math.hypot(x-o[0],z-o[1])<o[2]+pad)return true;
  return false;
}

/* ---------- isola ---------- */
{
  const top=new THREE.CircleGeometry(ISL,96);top.rotateX(-PI/2);
  P(world,top,0x9ad865,0,0,0,{tex:'grass',uv:[24,24],line:0,cast:false});
  P(world,CY(ISL,ISL-0.6,1.2,96),0x6fae46,0,-0.61,0,{line:0.12,cast:false});
  P(world,CY(ISL-0.6,30,9,48),0xb98557,0,-5.6,0,{tex:'stone',uv:[30,2],line:0.12,cast:false});
  P(world,CO(30,18,32),0x9a6a45,0,-19.1,0,{rot:[PI,0,0],line:0.12,cast:false});
  for(let i=0;i<14;i++){const a=rnd()*PI*2,r=R(20,36);
    P(world,CO(R(1.2,2.6),R(4,9),6),pick([0x9a6a45,0xa87a52,0x8a5d3c]),Math.cos(a)*r,-15-R(2,8),Math.sin(a)*r,{rot:[PI,rnd()*3,0],line:0.08,cast:false});}
}

/* ---------- acqua cel ---------- */
const waterT={value:0};
function waterMat(base,light,k,edge){return new THREE.ShaderMaterial({
  uniforms:{t:waterT,base:{value:new THREE.Color(base)},light:{value:new THREE.Color(light)},k:{value:k},e:{value:edge}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:`uniform float t,k,e;uniform vec3 base,light;varying vec2 vUv;
    void main(){float x=vUv.x*k;float y=vUv.y;
      float w=sin(x*0.9-t*2.2+sin(y*9.0+t*1.3)*1.6+y*4.0);
      float b2=step(0.96,sin(x*1.7-t*3.1+y*11.0));
      vec3 c=mix(base,light,max(step(0.9,w),b2*0.8));
      c=mix(c,vec3(1.0),e*step(0.84,abs(y-0.5)*2.0)*0.9);
      gl_FragColor=vec4(c,1.0);}`});}

/* ---------- fiume, sorgente e ponte ---------- */
{
  const len=RX1-RX0,cx=(RX0+RX1)/2;
  P(world,uvB(len+0.6,0.2,RW+1.0,len/3,1.6),0xe6cf9e,cx,0,RZ,{tex:'dirt',line:0.05,cast:false});
  const w=new THREE.Mesh(new THREE.PlaneGeometry(len,RW),waterMat(0x3fa9e6,0xc4f1ff,len*0.55,1));
  w.rotation.x=-PI/2;w.position.set(cx,0.13,RZ);world.add(w);
  for(let i=0;i<7;i++)P(world,SP(R(0.9,1.6),0),pick([0x9aa0b4,0xa9adc0,0x8b90a6]),RX0-0.8+R(-1,1),0.4,RZ+R(-2.6,2.6),{line:0.06});
  for(let i=0;i<46;i++){const x=R(RX0,RX1-1);if(Math.abs(x)<3)continue;const s=rnd()<.5?1:-1;
    P(world,SP(R(0.18,0.45),0),pick([0x9aa0b4,0xadb2c4,0xc9c2d6]),x,0.12,RZ+s*(RW/2+R(0.1,0.5)),{line:0.03,cast:false});}
  // ponte ad arco
  const g=new THREE.Group();g.position.set(0,0,RZ);world.add(g);
  const bh=z=>0.3+0.6*(1-(z/3.5)*(z/3.5));
  for(let i=0;i<7;i++){const zc=-3+i,ang=Math.atan(1.2*zc/12.25);
    P(g,uvB(3.0,0.18,1.04,2,1),0xa8774c,0,bh(zc),zc,{tex:'wood',rot:[ang,0,0],line:0.04});
    for(const sx of[-1.45,1.45]){P(g,uvB(0.16,0.14,1.04,1,1),0x8a5d3c,sx,bh(zc)+0.85,zc,{rot:[ang,0,0],line:0.025});}}
  for(let i=0;i<8;i++){const zc=-3.5+i;for(const sx of[-1.45,1.45])P(g,B(0.16,0.95,0.16),0x7a5235,sx,bh(Math.max(-3.4,Math.min(3.4,zc)))+0.42,zc,{line:0.025});}
  for(const s of[-1,1])P(g,uvB(3.6,0.6,0.8,3,0.6),0xc9c2d6,0,0.2,s*3.7,{tex:'stone',line:0.05});
}

/* ---------- sentieri ---------- */
function path(ax,az,bx,bz,w){const len=Math.hypot(bx-ax,bz-az);const g=new THREE.PlaneGeometry(w,len);g.rotateX(-PI/2);uvS(g,w/2.5,len/2.5);
  const m=P(world,g,0xffffff,(ax+bx)/2,0.03,(az+bz)/2,{tex:'dirt',line:0,cast:false});m.rotation.y=Math.atan2(bx-ax,bz-az);}
path(0,PLAZA-0.5,0,ISL-0.8,2.8);
path(0,-PLAZA+0.5,0,-21,2.6);
path(MP0.x,MP0.z,MP1.x,MP1.z,2.6);

/* ---------- piazza in ciottoli ---------- */
P(world,CY(PLAZA,PLAZA+0.2,0.3,72),0xcab89a,0,0.1,0,{tex:'stone',uv:[40,0.7],line:0.06,cast:false});
{const top=new THREE.CircleGeometry(PLAZA,72);top.rotateX(-PI/2);P(world,top,0xffffff,0,0.252,0,{tex:'cobble',uv:[7,7],line:0,cast:false});
 const ring=new THREE.RingGeometry(4.5,5.1,64);ring.rotateX(-PI/2);P(world,ring,0xc9b08a,0,0.256,0,{line:0,cast:false});}

/* ---------- fontana a tre vasche ---------- */
const FY=0.25;
{
  P(world,CY(4.3,4.5,0.22,48),0xc9c2d6,0,FY+0.11,0,{tex:'stone',uv:[16,0.3],line:0.05});
  P(world,CY(3.7,3.8,0.65,48),0xd4cde4,0,FY+0.22+0.32,0,{tex:'stone',uv:[14,1],line:0.06});
  P(world,TO(3.6,0.2,48),0xc9c2d6,0,FY+0.94,0,{rot:[PI/2,0,0],line:0.04});
  const w1=new THREE.CircleGeometry(3.55,48);w1.rotateX(-PI/2);const wm=new THREE.Mesh(w1,waterMat(0x49b5ec,0xd2f6ff,12,0));wm.position.y=FY+0.9;world.add(wm);
  P(world,CY(0.75,0.95,1.1,16),0xc9c2d6,0,FY+1.35,0,{tex:'stone',uv:[4,1],line:0.05});
  P(world,CY(0.36,0.46,1.7,14),0xd4cde4,0,FY+2.6,0,{line:0.04});
  for(const y of[2.0,3.2])P(world,TO(0.45,0.07,20),0xffcf4a,0,FY+y,0,{rot:[PI/2,0,0],line:0});

function bake(root){
  root.updateMatrixWorld(true);const buckets=new Map(),ink=[];const other=[];
  root.traverse(o=>{if(!o.isMesh)return;
    if(o.material.isShaderMaterial){other.push(o);return;}
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrixWorld);
    const p=new THREE.BufferGeometry();p.setAttribute('position',g.attributes.position);
    if(o.material===inkMat){ink.push(p);return;}
    p.setAttribute('normal',g.attributes.normal);
    p.setAttribute('uv',g.attributes.uv||new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const k=o.material.uuid+(o.castShadow?'c':'n');if(!buckets.has(k))buckets.set(k,{mat:o.material,cast:o.castShadow,geos:[]});buckets.get(k).geos.push(p);});
  other.forEach(o=>{o.updateMatrixWorld(true);const m=o.matrixWorld.clone();o.parent.remove(o);o.matrix.copy(m);o.matrix.decompose(o.position,o.quaternion,o.scale);scene.add(o);});
  scene.remove(root);
  for(const b of buckets.values()){const g=THREE.BufferGeometryUtils.mergeBufferGeometries(b.geos);if(!g)continue;const m=new THREE.Mesh(g,b.mat);m.castShadow=b.cast;m.receiveShadow=true;m.matrixAutoUpdate=false;scene.add(m);}
  for(let i=0;i<ink.length;i+=1500){const g=THREE.BufferGeometryUtils.mergeBufferGeometries(ink.slice(i,i+1500));if(g){const m=new THREE.Mesh(g,inkMat);m.matrixAutoUpdate=false;scene.add(m);}}
}

  // movimento
  let mf=-jy,ms=jx;
  if(keys.has('KeyW')||keys.has('ArrowUp'))mf+=1;if(keys.has('KeyS')||keys.has('ArrowDown'))mf-=1;
  if(keys.has('KeyD')||keys.has('ArrowRight'))ms+=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))ms-=1;
  const mag=Math.min(1,Math.hypot(mf,ms));
  if(mag>0.05){const sp=(keys.has('ShiftLeft')||keys.has('ShiftRight')?5.5:3.0)*dt/Math.max(1,Math.hypot(mf,ms));
    player.x+=(-Math.sin(yaw)*mf+Math.cos(yaw)*ms)*sp;player.z+=(-Math.cos(yaw)*mf-Math.sin(yaw)*ms)*sp;collide(player);bob+=dt*mag*9;}
  const gy=groundAt(player.x,player.z)+1.7;player.y+=(gy-player.y)*Math.min(1,dt*10);
  camera.position.set(player.x,player.y+Math.sin(bob)*0.035*Math.min(1,mag*3),player.z);
  camera.rotation.set(pitch,yaw,0);
  // ombre e sole seguono chi cammina
  const sx=Math.round(player.x/2)*2,sz=Math.round(player.z/2)*2;
  sun.target.position.set(sx,0,sz);sun.position.set(sx+sunDir.x*70,sunDir.y*70,sz+sunDir.z*70);
  sunSprite.position.copy(camera.position).addScaledVector(sunDir,320);

  blades.rotation.z-=dt*0.9;crys.rotation.y+=dt*0.8;crystal.position.y=30+Math.sin(T*1.2)*0.6;
  shards.forEach((s,k)=>{const a=T*1.4+k*2.09;s.position.set(Math.cos(a)*3,Math.sin(T*2+k)*0.7,Math.sin(a)*3);s.rotation.y+=dt*2;});
  crystalHalo.material.opacity=0.45+Math.sin(T*3)*0.12;
  islets.forEach(([g,y,ph])=>{g.position.y=y+Math.sin(T*0.6+ph)*0.8;g.rotation.y+=dt*0.03;});
  clouds.forEach(c=>{c[0].position.x+=c[1]*dt;if(c[0].position.x>95)c[0].position.x=-95;});
  flags.forEach(f=>{const p=f.geo.attributes.position;for(let i=0;i<p.count;i++){const bx=f.base[i*3];p.array[i*3+2]=Math.sin(bx*2.6-T*6)*0.18*bx;}p.needsUpdate=true;f.geo.computeVertexNormals();});
  flagSpecs.forEach((f,i)=>{fd.position.copy(f.p);fd.rotation.set(Math.sin(T*2.3+f.ph)*0.35+Math.sin(T*0.7)*0.15,f.yaw,0);fd.updateMatrix();bunting.setMatrixAt(i,fd.matrix);});
  bunting.instanceMatrix.needsUpdate=true;
  for(const p of puffs){const l=(T*0.28+p.ph)%1;
    p.m.position.set(p.base.x+l*1.8+Math.sin(l*6+p.ph*9)*0.25,p.base.y+l*4.2,p.base.z+l*0.6);p.m.scale.setScalar(Math.max(Math.sin(l*PI)*(0.55+l*1.1),0.001));}
  for(const r of ripples){const l=(T*0.55+r.ph)%1;if(l<r.last){const a=rnd()*PI*2,rad=R(2.1,3.2);r.x=Math.cos(a)*rad;r.z=Math.sin(a)*rad;}r.last=l;
    r.m.position.set(r.x,FY+0.93,r.z);r.m.scale.setScalar(0.15+l*0.5);r.m.material.opacity=(1-l)*0.75;}

  {const p=fount.pos,v=fount.vel;for(let i=0;i<fount.n;i++){
    if(fount.life[i]<0){fount.life[i]+=dt;fount.alpha[i]=0;continue;}
    v[i*3+1]-=9.8*dt;p[i*3]+=v[i*3]*dt;p[i*3+1]+=v[i*3+1]*dt;p[i*3+2]+=v[i*3+2]*dt;fount.alpha[i]=0.95;
    if(p[i*3+1]<fland[i]){if(ftype[i]===2&&rnd()<0.35)emitSplash(p[i*3],p[i*3+2]);spawnF(i);fount.life[i]=0;}}fount.flush();}
  {const p=splash.pos,v=splash.vel;for(let i=0;i<splash.n;i++){splash.life[i]-=dt;if(splash.life[i]<=0){splash.alpha[i]=0;continue;}
    v[i*3+1]-=9.8*dt;p[i*3]+=v[i*3]*dt;p[i*3+1]+=v[i*3+1]*dt;p[i*3+2]+=v[i*3+2]*dt;splash.alpha[i]=splash.life[i]*2;}splash.flush();}
  {const p=fall.pos,v=fall.vel;for(let i=0;i<fall.n;i++){
    if(fall.life[i]<0){fall.life[i]+=dt;fall.alpha[i]=0;continue;}
    v[i*3+1]-=9.8*dt;v[i*3]*=0.995;p[i*3]+=v[i*3]*dt;p[i*3+1]+=v[i*3+1]*dt;p[i*3+2]+=v[i*3+2]*dt;
    const y=p[i*3+1];fall.alpha[i]=Math.max(0,Math.min(1,1+y/30));fall.size[i]+=dt*0.12;if(y<-30){spawnW(i);fall.life[i]=0;}}fall.flush();
    for(let i=0;i<mist.n;i++){mist.life[i]+=dt;const l=(mist.life[i]%4)/4;
      mist.pos[i*3]=RX1+1+l*3+Math.sin(mist.ph[i])*1.2;mist.pos[i*3+1]=-1-l*6-Math.cos(mist.ph[i])*2;mist.pos[i*3+2]=RZ+Math.sin(mist.ph[i]*3)*2.5;
      mist.size[i]=1.2+l*2.4;mist.alpha[i]=Math.sin(l*PI)*0.35;}mist.flush();}
  {const c=crystal.position;for(let i=0;i<spark.n;i++){spark.vel[i*3]+=spark.vel[i*3+2]*dt;spark.life[i]+=dt*(0.5+0.6*Math.abs(Math.sin(spark.ph[i])));
    if(spark.life[i]>36){spark.life[i]=19;spark.vel[i*3+1]=R(1.2,4.5);}
    const y=spark.life[i],rr2=spark.vel[i*3+1]*(0.6+0.4*Math.sin(y*0.6));
    spark.pos[i*3]=c.x+Math.cos(spark.vel[i*3])*rr2;spark.pos[i*3+1]=y;spark.pos[i*3+2]=c.z+Math.sin(spark.vel[i*3])*rr2;
    spark.alpha[i]=Math.max(0,Math.min(1,(y-19)/3,(36-y)/4))*(0.45+0.55*Math.max(0,Math.sin(T*5+spark.ph[i])));}spark.flush();}
  for(let i=0;i<pollen.n;i++){const ph=pollen.ph[i];
    pollen.pos[i*3]=wrap(pollen.pos[i*3]+(0.3+Math.sin(T*0.3+ph)*0.25)*dt,player.x,28);
    pollen.pos[i*3+1]+=Math.sin(T*0.9+ph)*0.22*dt;
    pollen.pos[i*3+2]=wrap(pollen.pos[i*3+2]+Math.cos(T*0.4+ph)*0.2*dt,player.z,28);
    pollen.alpha[i]=0.3+0.45*Math.max(0,Math.sin(T*1.5+ph));}pollen.flush();
  for(let i=0;i<petals.n;i++){const ph=petals.ph[i];
    petals.pos[i*3]+=(0.5+Math.sin(T*1.7+ph)*0.9)*dt;petals.pos[i*3+1]-=(0.55+0.25*Math.sin(ph))*dt;petals.pos[i*3+2]+=Math.cos(T*1.3+ph)*0.5*dt;
    petals.size[i]=0.2*(0.6+0.4*Math.abs(Math.sin(T*3+ph)));if(petals.pos[i*3+1]<0.06)spawnP(i,false);}petals.flush();
  for(let i=0;i<glint.n;i++){glint.pos[i*3]+=1.4*dt;if(glint.pos[i*3]>RX1)glint.pos[i*3]=RX0;glint.alpha[i]=Math.pow(Math.max(0,Math.sin(T*2.4+glint.ph[i])),8);}glint.flush();
  if(steamBases.length)for(let i=0;i<steam.n;i++){steam.life[i]+=dt;const l=(steam.life[i]%2.4)/2.4,b=steamBases[i%steamBases.length],ph=steam.ph[i];
    steam.pos[i*3]=b.x+Math.sin(l*4+ph)*0.08+l*0.15;steam.pos[i*3+1]=b.y+l*1.1;steam.pos[i*3+2]=b.z+Math.cos(l*3+ph)*0.08;
    steam.size[i]=0.12+l*0.4;steam.alpha[i]=Math.sin(l*PI)*0.4;}steam.flush();
  if(bubbleBases.length)for(let i=0;i<bubbles.n;i++){bubbles.life[i]+=dt;const l=(bubbles.life[i]%2)/2,b=bubbleBases[i%bubbleBases.length],ph=bubbles.ph[i];
    bubbles.pos[i*3]=b.x+Math.sin(l*6+ph)*0.06;bubbles.pos[i*3+1]=b.y+l*0.7;bubbles.pos[i*3+2]=b.z+Math.cos(l*5+ph)*0.06;
    bubbles.size[i]=0.08+0.05*Math.sin(ph);bubbles.alpha[i]=Math.sin(l*PI)*(0.5+0.5*Math.sin(T*8+ph));}bubbles.flush();

  renderer.render(scene,camera);requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?76:66;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);setPsScale();});
})();
</script>
