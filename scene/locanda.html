<title>Locanda del Boccale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: vista in prima persona a tutto schermo con l'HUD di Valfiorita: targa in alto a sinistra, filtri in alto a destra, joystick in basso a sinistra, punti di vista in basso a destra. Un solo tema scuro: è l'interfaccia del gioco. */
:root {
  --ground: #110e0b;
  --panel: rgba(26, 21, 16, 0.88);
  --panel-hi: #241d16;
  --picked: #2e2418;
  --bronze: #5c452b;
  --bronze-lit: #d6a352;
  --key-edge: #9a7550;
  --text: #dccdb4;
  --dim: #a3917a;
  --gold: #ffd999;
  --outline: #080503;
  --f-display: "Jacquard 24", "Pixelify Sans", ui-monospace, monospace;
  --f-ui: "Pixelify Sans", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: #1a1410; color: var(--text); font-family: var(--f-ui); }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }
.panel { background: var(--panel); border: 3px solid var(--bronze); box-shadow: 0 0 0 2px var(--outline); }
.plate { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); padding: 8px 14px 10px; pointer-events: none; box-sizing: border-box; max-width: min(380px, calc(100% - 160px)); display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--bronze-lit); }
.plate h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 6vw, 42px); line-height: .95; margin: 0; color: var(--gold); text-wrap: balance; text-shadow: 2px 2px 0 var(--outline); }
.keys { margin: 2px 0 0; font-size: 13px; color: var(--dim); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
kbd { font-family: var(--f-ui); font-size: 12px; color: var(--text); background: var(--panel-hi); border: 2px solid var(--key-edge); box-shadow: 0 0 0 1px var(--outline); padding: 0 5px; line-height: 17px; }
.touch-only { display: none; }
@media (pointer: coarse) { .mouse-only { display: none; } .touch-only { display: inline; } }
.filters { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
button.act { font-family: var(--f-ui); font-size: 15px; padding: 5px 12px; cursor: pointer; color: var(--text); background: var(--panel); border: 2px solid var(--bronze); box-shadow: 0 0 0 2px var(--outline); }
button.act:hover { border-color: var(--bronze-lit); color: var(--gold); }
button.act:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
button.act[aria-pressed="true"] { border-color: var(--bronze-lit); color: var(--gold); background: var(--picked); }
button.act[aria-pressed]::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; vertical-align: 1px; background: var(--bronze); box-shadow: 0 0 0 1px var(--outline); }
button.act[aria-pressed="true"]::before { background: var(--gold); }
.views { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: calc(100% - 170px); }
.stick { position: fixed; left: max(20px, calc(env(safe-area-inset-left, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); width: 112px; height: 112px; touch-action: none; background: rgba(26, 21, 16, 0.55); border: 3px solid var(--bronze); box-shadow: 0 0 0 2px var(--outline);
  clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px); }
.knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; background: var(--gold); border: 3px solid var(--bronze-lit); box-shadow: inset -4px -4px 0 #c99a4a; pointer-events: none; }
.err { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 16px; color: var(--gold); max-width: calc(100% - 48px); text-align: center; overflow-wrap: anywhere; }
</style>

<canvas id="scene" aria-label="Vista in prima persona dentro una locanda fantasy di sera: sala con camino, lampadario a ruota, tavoli e bancone; cucina; ballatoio e stanza con il letto al piano di sopra"></canvas>
<div class="plate panel">
  <span class="eyebrow">Valfiorita · sera di pioggia</span>
  <h1>Locanda del Boccale</h1>
  <p class="keys mouse-only"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> cammina · <kbd>Shift</kbd> corri · trascina per guardare</p>
  <p class="keys touch-only">Trascina per guardare · joystick per camminare</p>
</div>
<div class="filters"><button class="act" id="scan" type="button" aria-pressed="true">Linee</button><button class="act" id="refl" type="button" aria-pressed="true">Riflessi</button></div>
<div class="stick" id="stick" role="application" aria-label="Joystick per camminare"><div class="knob" id="knob"></div></div>
<div class="views" role="group" aria-label="Punti di vista">
  <button class="act" type="button" data-view="sala">Sala</button><button class="act" type="button" data-view="cucina">Cucina</button><button class="act" type="button" data-view="ballatoio">Ballatoio</button><button class="act" type="button" data-view="stanza">Stanza</button>
</div>

<script>

window.addEventListener('error',e=>{const b=document.getElementById('err');if(!b)return;b.textContent='Errore: '+(e.message||e)+(e.lineno?' (riga '+e.lineno+')':'');b.hidden=false;});

<script>
(function(){
'use strict';
const errBox=document.getElementById('err');
if(!window.THREE){errBox.hidden=false;return;}
const V=THREE.Vector3,PI=Math.PI,UP=new V(0,1,0);

/* ================= pianta (metri) ================= */
// sala a doppia altezza davanti (z>0), ballatoio e stanze sopra la parte di fondo (z<0)
const X0=-6,X1=6,Z0=-5,Z1=5,WT=0.4,FL1=3.0,EAVE=5.6,RIDGE=9.1,SLOPE=(RIDGE-EAVE)/5;
const KX=1.0,KZ=-2.0;          // cucina: x>KX, z<KZ (piano terra)
const BRX=1.5,BRZ=-1.6;        // camera da letto: x>BRX, z<BRZ (piano di sopra)
const STX1=-4.9,STZ0=3.92;     // scala lungo il muro di sinistra: x<STX1, dal primo gradino (z=STZ0) al ballatoio (z=0)
const BEAMB=2.49;              // intradosso delle travi maestre
const FZ=2.6;                  // asse del camino sul muro x=6
const CH=new V(1.2,3.55,2.6);  // centro del lampadario a ruota

/* ================= renderer ================= */
const canvas=document.getElementById('scene');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:false});}catch(e){errBox.hidden=false;return;}
const PR=Math.min(window.devicePixelRatio||1,1.5);
renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;

const scene=new THREE.Scene();
const FOG=new THREE.Color(0x1d1712),FOG_D=0.04;
renderer.setClearColor(FOG,1);
scene.fog=new THREE.FogExp2(FOG,FOG_D);
const camera=new THREE.PerspectiveCamera(innerWidth<innerHeight?76:66,innerWidth/innerHeight,0.05,80);
camera.rotation.order='YXZ';
// luce di fondo: poca e un po' fredda (la notte che entra dalle finestre), così le ombre virano al freddo e le zone illuminate restano calde
scene.add(new THREE.HemisphereLight(0x4c4e5a,0x1c140e,0.46));
scene.add(new THREE.AmbientLight(0x2a2a32,0.26));

/* ================= rng ================= */
let seed=20261113;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

const R=(a,b)=>a+rnd()*(b-a);

/* ================= texture disegnate a pixel ================= */
function pix(S,fn,rot){const c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),im=x.createImageData(S,S);
  for(let y=0;y<S;y++)for(let X=0;X<S;X++){const[u,v]=rot?[y,S-1-X]:[X,y];const p=fn(u,v,S);if(p[0]===p[1]&&p[1]===p[2]){const t=(hn(X>>2,y>>2,91)-0.5)*0.24+(hn(X,y,92)-0.5)*0.08,gq=(hn(X>>3,y>>3,93)-0.5)*0.12;p[0]*=1+t;p[1]*=1+gq;p[2]*=1-t;}const k=(y*S+X)*4;im.data[k]=p[0];im.data[k+1]=p[1];im.data[k+2]=p[2];im.data[k+3]=255;}
  x.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());return t;}
const hn=(a,b,c)=>{let h=Math.imul(a|0,73856093)^Math.imul(b|0,19349663)^Math.imul((c|0)+7,83492791);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;};
const G=v=>{v=Math.max(0,Math.min(255,v|0));return[v,v,v];};
// lastre di pietra: file di altezza variabile e lastre di larghezza variabile, calcolate una volta sola
const FLAGS=(()=>{const rows=[0];let i=0;while(rows[rows.length-1]<128-38)rows.push(rows[rows.length-1]+20+((hn(i++,0,200)*10)|0));rows.push(128);
  const cuts=rows.slice(0,-1).map((_,r)=>{const x0=(hn(r,1,201)*24)|0,c=[x0];let x=x0;while(true){x+=22+((hn(r,c.length,202)*20)|0);if(x>x0+128-18)break;c.push(x);}c.push(x0+128);return c;});return{rows,cuts};})();
const TEX={
  stone:pix(64,(u,v)=>{const row=v>>4,off=(row&1)*12,col=Math.floor((u+off)/24),lu=(u+off)%24,lv=v&15;if(lv===15||lu===0)return G(85);const b=185+hn(col,row,3)*55,q=hn(u,v,4),m=hn(u>>2,v>>2,30);if(lv>11&&m<.3)return G(b*0.7);return G(b*(0.88+q*.16)+(lv<2?14:0)-(lu>21?14:0));}),
  wood:pix(128,(u,v)=>{
    const edges=[0,22,38,61,80,104,128];let pl=0;while(u>=edges[pl+1])pl++;const x0=edges[pl],w=edges[pl+1]-x0,lu=u-x0;
    const joint=(hn(pl,9,120)*128)|0,seg=((v-joint+128)%128)<64?0:1,id=pl*2+seg;
    if(lu===0||((v-joint+128)%64)===0)return G(48);
    if(lu===1||lu===w-1)return G(118+hn(u,v,121)*20);
    let b=150+hn(id,0,122)*55;const grey=hn(id,1,123)<0.3;
    const kx=x0+2+hn(id,2,124)*(w-4),ky=hn(id,3,125)*128,dx=u-kx,dy=(v-ky+192)%128-64,kd=Math.hypot(dx*1.6,dy);
    const warp=12/(1+kd*0.12);
    const gr=Math.sin((lu+Math.sin(v*0.07+id)*2.2+warp*Math.sign(dx||1))*1.25+hn(id,4,126)*6);
    b+=gr*14+Math.sin(v*0.9+lu*2.1+id)*3+(hn(u,v,127)-0.5)*18;
    if(kd<2.6&&hn(id,5,128)<0.75)b=kd<1.3?52:90;
    if(hn(id,6,129)<0.35&&Math.abs(lu-(w*0.45|0))<1&&((v+id*13)%128)<40)b-=55;
    if((lu===2||lu===w-3)&&((v-joint+128)%64===4))b=40;
    if(hn(u>>1,v>>2,130)<.05)b-=28;
    return grey?[b*0.92,b*0.92,b*0.9]:G(b);}),
  // intonaco d'interno: senza la fascia scura in basso (lo sporco lo mette wear), con segni di cazzuola
  plasterIn:pix(64,(u,v)=>{const q=hn(u,v,15),p=hn(u>>4,v>>4,16),s=hn(u>>3,v>>2,19);let b=214+p*22+q*12-(s<.08?14:0);if(hn(u>>1,v>>3,17)<.03)b-=40;if(hn(u>>2,v,18)<.012)b-=28;if(Math.abs(Math.sin((u+v*0.3)*0.21)+Math.sin(v*0.13))>1.6)b-=7;return G(b);}),
  bark:pix(32,(u,v)=>{const f=Math.sin(u*0.9+Math.sin(v*0.21)*2.2+hn(u>>2,0,70)*3);let b=150+f*38+hn(u,v,71)*28;if(hn(u>>1,v>>3,72)<.08)b-=60;return G(b);}),
  leaf:pix(32,(u,v)=>{const q=hn(u>>1,v>>1,50),p=hn(u,v,51);if(q<.2)return G(60+p*30);if(q>.88)return G(255);return G(140+q*100+p*25);}),
  flag:pix(128,(u,v)=>{const RW=FLAGS.rows;let r=0;while(v>=RW[r+1])r++;const lv=v-RW[r],h=RW[r+1]-RW[r];const E=FLAGS.cuts[r],uu=(u-E[0]+128)%128;let k=0;while(k+2<E.length&&uu>=E[k+1]-E[0])k++;
    const lu=uu-(E[k]-E[0]),w=E[k+1]-E[k],id=r*16+k;if(lv===0||lu===0)return G(58+hn(u,v,203)*18);if(lv===1||lu===1)return G(98);
    const q=hn(u,v,204),m=hn(u>>2,v>>2,205);let b=(150+hn(id,0,206)*65)*(0.9+q*0.14);if(lv>=h-2||lu>=w-2)b*=0.86;if(m<0.05)b-=26;
    if(hn(id,1,207)<0.25&&Math.abs((lu-lv*0.7)-w*0.4)<0.7)b=80;return G(b);}),
  brick:pix(64,(u,v)=>{const row=v>>2,off=(row&1)*8,col=(u+off)>>4,lu=(u+off)&15,lv=v&3;if(lv===3||lu===0)return G(66+hn(u,v,210)*24);let b=(150+hn(col,row,211)*80)*(0.88+hn(u,v,212)*0.18)+(lv===0?10:0);if(hn(col,row,213)<0.12)b*=0.62;return G(b);}),
  staves:pix(64,(u,v)=>{const st=u>>3,lu=u&7;if(lu===0)return G(52);let b=140+hn(st,0,220)*60+Math.sin(v*0.5+st*3+Math.sin(v*0.13)*2)*8+(hn(u,v,221)-0.5)*20;if(lu===1)b+=14;if(hn(u>>1,v>>2,222)<0.05)b-=30;return G(b);}),
  rings:pix(32,(u,v)=>{const dx=u-15.5,dy=v-15.5,r=Math.hypot(dx,dy);if(r>14.5)return G(70);if(r>12.8)return G(90+hn(u,v,230)*30);let b=176+Math.sin(r*1.9+hn(u>>2,v>>2,231))*22+hn(u,v,232)*16;if(Math.abs(Math.atan2(dy,dx)-0.7)<0.09&&r>3)b=72;if(r<1.5)b-=40;return G(b);}),
  linen:pix(32,(u,v)=>G(200+((u+v)&1)*12+hn(u,v,240)*18-(hn(u>>2,v>>3,241)<0.1?18:0))),
  wool:pix(32,(u,v)=>G(140+((v&1)?14:0)+hn(u>>1,v,250)*40+(hn(u>>3,v>>2,251)-0.5)*24)),
  // fodera del pagliericcio a righe (traliccio)
  tick:pix(32,(u,v)=>{const q=hn(u,v,260)*14-(hn(u>>2,v>>2,261)<0.1?16:0);return (u&7)<2?[96+q,106+q,124+q]:[208+q,198+q,172+q];}),
  // trapunta a toppe: colori smorzati della palette, cuciture chiare, qualche rombo
  quilt:pix(64,(u,v)=>{const PAL=[[150,58,48],[168,130,66],[74,92,58],[62,78,104],[196,184,160],[110,76,52]];const px=u>>4,py=v>>4,lu=u&15,lv=v&15;
    let c=PAL[(hn(px,py,270)*6)|0];if(hn(px,py,271)<0.4&&Math.abs(lu-7.5)+Math.abs(lv-7.5)<5)c=PAL[(hn(px,py,272)*6)|0];
    let k=0.9+hn(u,v,273)*0.16;if(lu===0||lv===0)k=0.55;else if((lu===1||lv===1)&&((u+v)&1))k=1.18;return[c[0]*k,c[1]*k,c[2]*k];}),
  rug:pix(64,(u,v)=>{const d=Math.min(u,v,63-u,63-v),q=0.88+hn(u,v,275)*0.2;let c;const RED=[140,42,36],BLU=[44,60,90],OCH=[176,138,72],CRM=[190,176,150],DRK=[40,30,26];
    if(d<2)c=DRK;else if(d<6)c=(d===4&&((u+v)&3)===0)?CRM:RED;else if(d<8)c=OCH;else if(Math.abs(u-31.5)+Math.abs(v-31.5)<10)c=Math.abs(u-31.5)+Math.abs(v-31.5)>7?OCH:RED;
    else c=(((u+v)&15)<2||((u-v+64)&15)<2)?CRM:BLU;return[c[0]*q,c[1]*q,c[2]*q];})
};
// brace: pixel arancio e giallo su fondo scuro (MeshBasic, la luce è nella texture)
const EMBER=pix(32,(u,v)=>{const q=hn(u>>1,v>>1,290),p=hn(u,v,291);if(q>0.74)return[255,150+p*80,60];if(q>0.5)return[200,70+p*40,20];return[50+p*30,24,16];});
// vetro della lanterna: chiaro al centro dove sta la fiamma, fumo in alto, bordi sporchi
const LGLASS=pix(16,(u,v)=>{const cx=Math.abs(u-7.5),cy=v-9;let b=150+Math.max(0,60-cx*cx*4-cy*cy*1.5);if(cx<1.6-Math.abs(cy)*0.18&&v>4&&v<13)b=255;if(v<3)b-=60;if(u<1||u>14)b-=40;if(hn(u,v,62)<.08)b-=25;return G(b);});
// quello che si vede dalle finestre: notte di pioggia, tetti delle case di fronte e qualche finestra accesa
const NIGHT=pix(64,(u,v)=>{const hb=(hn(u>>4,0,280)*6)|0,lu=u&15,roof=30+hb-Math.max(0,7-Math.abs(lu-7.5))*0.9;
  if(v<roof){const c=hn(u>>2,v>>2,281);let r=30+v*0.35+c*6,g=38+v*0.4+c*6,b=50+v*0.4+c*7;if(((u*2+v)%11===0)&&hn(u,v,282)<0.3){r+=14;g+=16;b+=18;}return[r,g,b];}
  const q=hn(u,v,283)*6;let r=20+q,g=21+q,b=24+q;const wx=(lu>=4&&lu<=6)||(lu>=10&&lu<=12),wy=(v>=roof+5&&v<=roof+8)||(v>=roof+14&&v<=roof+17);
  if(wx&&wy&&hn((u>>4)*7+(lu>8?1:0),v>roof+10?1:0,284)<0.55){const w=0.75+hn(u,v,285)*0.25;return[220*w,140*w,64*w];}
  if(v>58){r-=6;g-=6;b-=6;}return[r,g,b];});

/* ================= materiali ================= */
function mute(h){const c=new THREE.Color(h),l=c.r*.3+c.g*.59+c.b*.11;c.r=(c.r*.8+l*.2)*.9;c.g=(c.g*.8+l*.2)*.92;c.b=(c.b*.8+l*.2)*.88;return c;}
// usura d'interno (weathering) calcolata sulla posizione nel mondo: sporco e calci che salgono dal pavimento del proprio piano,
// fuliggine che annerisce travi e soffitto salendo, colature di fumo e grasso, grana di sporco, macchie sulle facce orizzontali.
// Al posto del muschio dell'esterno c'è la fuliggine.
const WEAR_V='varying vec3 vWq;varying vec3 vNw;\n';
function wear(m){m.onBeforeCompile=s=>{
  s.vertexShader=WEAR_V+s.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\n{vec4 wq=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nwq=instanceMatrix*wq;\n#endif\nvWq=(modelMatrix*wq).xyz;vNw=normalize(mat3(modelMatrix)*objectNormal);}');
  s.fragmentShader=WEAR_V+'float wh(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}\n'+s.fragmentShader.replace('#include <fog_fragment>',
   '{vec3 q=floor(vWq*14.0);float vert=1.0-abs(vNw.y);float n=wh(q);'+
   'float fl=(vWq.y>'+(FL1-0.06).toFixed(2)+'&&vWq.z<0.02)?'+FL1.toFixed(2)+':0.0;float y=vWq.y-fl;'+
   'float g=mix(0.58,1.0,smoothstep(0.0,1.1,y-0.04+n*0.3));'+
   'vec2 tg=normalize(vec2(-vNw.z,vNw.x)+vec2(1e-4));float cl=floor(dot(vWq.xz,tg)*7.0);float s=wh(vec3(cl,3.1,7.7));'+

/* ================= unione della geometria statica (static batching) ================= */
function bake(root){
  root.updateMatrixWorld(true);const buckets=new Map(),other=[];
  root.traverse(o=>{if(!o.isMesh)return;
    if(o.material.isShaderMaterial||Array.isArray(o.material)){other.push(o);return;}
    const g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();g.applyMatrix4(o.matrixWorld);
    const p=new THREE.BufferGeometry();p.setAttribute('position',g.attributes.position);
    p.setAttribute('normal',g.attributes.normal);
    p.setAttribute('uv',g.attributes.uv||new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
    const k=o.material.uuid+(o.castShadow?'c':'n');if(!buckets.has(k))buckets.set(k,{mat:o.material,cast:o.castShadow,geos:[]});buckets.get(k).geos.push(p);});
  other.forEach(o=>{o.updateMatrixWorld(true);const m=o.matrixWorld.clone();o.parent.remove(o);o.matrix.copy(m);o.matrix.decompose(o.position,o.quaternion,o.scale);scene.add(o);});
  scene.remove(root);
  for(const b of buckets.values()){const g=THREE.BufferGeometryUtils.mergeBufferGeometries(b.geos);if(!g)continue;const m=new THREE.Mesh(g,b.mat);m.castShadow=b.cast;m.receiveShadow=true;m.matrixAutoUpdate=false;scene.add(m);}
}

function collide(p){const r=0.24,up=p.f>1.5?1:0;
  for(const b of BOX[up])pushBox(p,b,r);
  for(const c of CIR[up]){const dx=p.x-c[0],dz=p.z-c[1],d=Math.hypot(dx,dz),m=c[2]+r;if(d<m&&d>1e-4){p.x=c[0]+dx/d*m;p.z=c[1]+dz/d*m;}}
  // la parte di scala più alta di un passo è un muro (il sottoscala chiuso); sulla scala il corrimano impedisce di uscire di lato
  const zl=STZ0+0.14-(p.f+0.55)/STK;if(zl>0)pushBox(p,[X0,0,STX1,zl],r);
  if(p.f>0.3&&p.f<FL1-0.15&&p.z>-0.05&&p.x<STX1+r)p.x=Math.min(p.x,STX1-r);
  p.x=Math.max(X0+r,Math.min(X1-r,p.x));p.z=Math.max(Z0+r,Math.min(Z1-r,p.z));}

function stepPlayer(dt,mf,ms,run){const mag=Math.min(1,Math.hypot(mf,ms));
  if(mag>0.05){const sp=(run?4.2:2.2)*dt/Math.max(1,Math.hypot(mf,ms));
    player.x+=(-Math.sin(yaw)*mf+Math.cos(yaw)*ms)*sp;player.z+=(-Math.cos(yaw)*mf-Math.sin(yaw)*ms)*sp;collide(player);bob+=dt*mag*9;}
  const g=groundAt(player.x,player.z,player.f);player.f+=(g-player.f)*Math.min(1,dt*12);return mag;}

/* ================= ciclo di animazione ================= */
const clock=new THREE.Clock();let T=0,frame=0;
const tmpC=new THREE.Color();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);T+=dt;
  let mf=-jy,ms=jx;
  if(keys.has('KeyW')||keys.has('ArrowUp'))mf+=1;if(keys.has('KeyS')||keys.has('ArrowDown'))mf-=1;
  if(keys.has('KeyD')||keys.has('ArrowRight'))ms+=1;if(keys.has('KeyA')||keys.has('ArrowLeft'))ms-=1;
  const mag=stepPlayer(dt,mf,ms,keys.has('ShiftLeft')||keys.has('ShiftRight'));
  camera.position.set(player.x,player.f+EYE+Math.sin(bob)*0.03*Math.min(1,mag*3),player.z);
  camera.rotation.set(pitch,yaw,0);
  // tremolio di fiamme, aloni e pozze di luce, legato alla sorgente
  for(const q of LIGHTS)q.fl=flick(q,T);
  pickLights(dt);
  FLAMES.forEach((f,i)=>{flames.k[i]=f.L?0.75+0.35*f.L.fl:1;});flames.g.attributes.fk.needsUpdate=true;
  HALOS.forEach((h,i)=>{halo.al[i]=h.a*(h.L?h.L.fl:1);});halo.g.attributes.ial.needsUpdate=true;
  POOLS.forEach((q,i)=>{const k=q.k*(q.L?q.L.fl:1);tmpC.setRGB(q.tint[0]*k,q.tint[1]*k,q.tint[2]*k);pools.setColorAt(i,tmpC);});pools.instanceColor.needsUpdate=true;
  EMB_MAT.color.setScalar(0.7+0.3*fireLight.fl);
  flameT.value=T;glassT.value=T;
  // le lanterne di carta dondolano un poco nella corrente della porta
  lanterns.forEach(l=>{l.pv.rotation.z=Math.sin(T*1.1+l.ph)*0.04;l.pv.rotation.x=Math.cos(T*0.9+l.ph)*0.03;});
  // pulviscolo: brilla solo dove c'è luce
  {const act=fixedL.map(o=>o.q).concat(slots.filter(s=>s.q).map(s=>s.q));
   for(let i=0;i<dust.n;i++){const ph=dust.ph[i],k=i*3;dust.pos[k]+=Math.sin(T*0.21+ph)*0.05*dt;dust.pos[k+1]+=Math.sin(T*0.33+ph*2)*0.04*dt;dust.pos[k+2]+=Math.cos(T*0.17+ph)*0.05*dt;
     let L=0;for(const q of act){const dx=dust.pos[k]-q.p.x,dy=dust.pos[k+1]-q.p.y,dz=dust.pos[k+2]-q.p.z;L+=q.i*q.fl/(1+(dx*dx+dy*dy+dz*dz)*1.2);}
     L=Math.min(1,L*0.45);dust.alpha[i]=L*(0.4+0.6*Math.abs(Math.sin(T*0.8+ph)));dust.col.set([1.0,0.72,0.42],k);}dust.flush();}
  // faville
  for(let i=0;i<embers.n;i++){const k=i*3;embers.life[i]-=dt;if(embers.life[i]<=0){const s=EMB_SRC[i%3===0?1:0];embers.pos.set([s.x+R(-0.15,0.15),s.y,s.z+R(-0.3,0.3)],k);embers.vel.set([R(-0.05,0.15),R(0.5,1.1),R(-0.08,0.08)],k);embers.life[i]=R(0.8,1.8);embers.size[i]=R(0.012,0.022);}
    embers.pos[k]+=embers.vel[k]*dt+Math.sin(T*7+embers.ph[i])*0.004;embers.pos[k+1]+=embers.vel[k+1]*dt;embers.pos[k+2]+=embers.vel[k+2]*dt;
    const l=Math.max(0,embers.life[i]);embers.alpha[i]=Math.min(1,l*1.2)*(0.6+0.4*Math.sin(T*20+embers.ph[i]));embers.col.set([1,0.55+0.3*Math.min(1,l),0.18],k);}embers.flush();
  // fumo sotto il tetto, scaldato dal lampadario
  for(let i=0;i<haze.n;i++){const k=i*3,ph=haze.ph[i];haze.off[k]+=Math.sin(T*0.05+ph)*0.08*dt;haze.off[k+2]+=Math.cos(T*0.04+ph)*0.06*dt;
    const dx=haze.off[k]-CH.x,dz=haze.off[k+2]-CH.z,dy=haze.off[k+1]-CH.y,w=1/(1+(dx*dx+dy*dy+dz*dz)*0.08);
    haze.al[i]=0.1+0.04*Math.sin(T*0.2+ph);haze.rot[i]=ph+T*0.015;haze.tint.set([HZ[0]+w*0.35,HZ[1]+w*0.24,HZ[2]+w*0.12],k);}haze.flush();
  // vapore del paiolo
  for(let i=0;i<steam.n;i++){steam.life[i]+=dt;const L=3,t=(steam.life[i]%L)/L,ph=steam.ph[i];steam.set(i,5.25+Math.sin(t*4+ph)*0.08+t*0.1,0.92+t*1.1,-4.0+Math.cos(t*3+ph)*0.08,0.15+t*0.55,0.3*Math.sin(PI*t),ph+t,STM);}steam.flush();
  if(frame<3)renderer.shadowMap.needsUpdate=true;frame++;
  renderFrame();requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?76:66;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);setPsScale();sizeRT();});
// per i test automatici: punti di vista nominati o liberi
window.__dbg=()=>({FUV,NLT,SH,slots:slots.map(s=>s.q?[s.q.kind,s.q.room,+s.f.toFixed(2),+s.L.intensity.toFixed(2)]:null),room:roomAt(player.x,player.f+0.1,player.z),progs:(renderer.info.programs||[]).length,tri:renderer.info.render.triangles,calls:renderer.info.render.calls});window.__walk=(mf,ms,n,y)=>{if(y!=null)yaw=y;for(let i=0;i<n;i++)stepPlayer(0.05,mf,ms,false);return{x:+player.x.toFixed(2),z:+player.z.toFixed(2),f:+player.f.toFixed(2),room:roomAt(player.x,player.f+0.1,player.z)};};window.__view=goView;window.__set=o=>{player.x=o.x;player.z=o.z;player.f=o.f||0;yaw=o.yaw;pitch=o.pitch||0;snapLights=true;};
})();
</script>
